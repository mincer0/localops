<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>LocalOps · 本地服务</title>
  <link rel="stylesheet" href="/static/localops.css">
  <script src="/static/localops.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">LOCAL SERVICE STATUS</p>
      <h1>LocalOps</h1>
      <p class="subtitle">这台 Mac 上的本地服务。此页只读，不会执行启动或停止操作。</p>
    </div>
    <div id="refresh-state" class="refresh-state">正在连接…</div>
  </header>

  <main>
    <section class="summary-grid" aria-label="状态摘要">
      <article><span>已登记</span><strong id="total">0</strong></article>
      <article><span>健康</span><strong id="healthy" class="good">0</strong></article>
      <article><span>需关注</span><strong id="attention" class="warn">0</strong></article>
      <article><span>待登记</span><strong id="discovered">0</strong></article>
    </section>

    <section class="machine-section" aria-labelledby="machine-title">
      <div class="section-title">
        <div><p class="eyebrow">HOST</p><h2 id="machine-title">机器状态</h2></div>
        <span>热状态来自 macOS，不读取私有温度传感器</span>
      </div>
      <div class="machine-grid">
      <article><span>内存</span><strong id="memory">—</strong></article>
      <article><span>磁盘可用</span><strong id="disk">—</strong></article>
        <article><span>热状态</span><strong id="thermal">—</strong></article>
        <article><span>CPU Load</span><strong id="cpu-load">—</strong></article>
        <article><span>开机时长</span><strong id="uptime">—</strong></article>
      </div>
    </section>

    <section class="toolbar">
      <div id="filters" class="filters" role="group" aria-label="筛选">
        <button class="active" data-filter="all">全部</button>
        <button data-filter="registered">已登记</button>
        <button data-filter="discovered">待登记</button>
        <button data-filter="history">最近掉线</button>
      </div>
      <label class="search">
        <span class="sr-only">搜索服务</span>
        <input id="search" type="search" placeholder="搜索名称、分组或端口">
      </label>
    </section>

    <p id="error" class="error" hidden></p>
    <section id="services" class="service-grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>没有匹配的服务。</p>

    <section class="events-section">
      <div class="section-title">
        <div><p class="eyebrow">HISTORY</p><h2>最近事件</h2></div>
        <span>只记录已登记服务的状态变化</span>
      </div>
      <div id="events" class="events"></div>
    </section>
  </main>

  <footer>仅监听 <code>127.0.0.1</code> · 数据来自 LocalOps Swift Core</footer>
</body>
</html>
